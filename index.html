<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phiếu đăng ký khóa học</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="form-wrap">
 
  <div class="form-header">
    <h1>📘 Phiếu đăng ký khóa học 📘</h1>
  </div>
 
  <form id="formDangKy">
    <div class="form-body">
 
      <div class="form-row">
        <label for="hoTen">Họ và tên*</label>
        <div class="field">
          <input type="text" id="hoTen" name="hoTen" required>
        </div>
      </div>
 
      <div class="form-row">
        <label for="soDienThoai">Số điện thoại*</label>
        <div class="field">
          <input type="tel" id="soDienThoai" name="soDienThoai" required>
        </div>
      </div>
 
      <div class="form-row">
        <label for="email">Email*</label>
        <div class="field">
          <input type="email" id="email" name="email" required>
        </div>
      </div>
 
      <div class="form-row">
        <label for="khoaHoc">Chọn khóa học</label>
        <div class="field">
          <select id="khoaHoc" name="khoaHoc">
            <option value="Web">Web</option>
            <option value="Mobile App">Mobile App</option>
            <option value="Data Science">Data Science</option>
            <option value="Thiết kế đồ họa">Thiết kế đồ họa</option>
          </select>
        </div>
      </div>
 
      <div class="form-row">
        <label>Hình thức học</label>
        <div class="field radio-field">
          <label class="radio-label"><input type="radio" id="radioTrucTiep" name="hinhThuc" value="Trực tiếp" checked> Trực tiếp</label>
          <label class="radio-label"><input type="radio" id="radioOnline" name="hinhThuc" value="Học online"> Học online</label>
        </div>
      </div>
 
      <div class="form-row">
        <label for="ghiChu">Ghi chú thêm</label>
        <div class="field">
          <textarea id="ghiChu" name="ghiChu" rows="4"></textarea>
        </div>
      </div>
 
    </div>
 
    <div class="form-footer">
      <button type="submit" id="btnDangKy">Đăng ký</button>
    </div>
  </form>
 
</div>
 
<script src="script.js"></script>
</body>
</html>
